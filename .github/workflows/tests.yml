name: Python tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q app.py engine.py tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Example CLI comparison
        run: python app.py --before examples/before --after examples/after
